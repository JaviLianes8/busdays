[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "busdays"
version = "0.2.0"
description = "Zero-dependency business-day arithmetic with a configurable weekend mask and optional holidays"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["business days", "workdays", "holidays", "calendar", "busday", "modified following", "date arithmetic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "numpy", "build", "twine"]

[project.scripts]
busdays = "busdays._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/busdays"
Issues = "https://github.com/JaviLianes8/busdays/issues"
Changelog = "https://github.com/JaviLianes8/busdays/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/busdays"]

[tool.hatch.build.targets.sdist]
# Upstream copies are fetched locally and never shipped; only their manifest is.
include = [
    "src",
    "tests",
    "scripts",
    "data/upstream/MANIFEST.json",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: builds the wheel and installs it into a fresh venv (needs network); run with -m e2e",
]
